name: HomeCamCamera
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  HomeCamCamera:
    type: application
    platform: iOS
    sources: [HomeCamCamera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homecam.camera
        PRODUCT_NAME: HomeCam Camera
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # 不要让 XcodeGen 生成 Info.plist：它会重写文件并丢掉权限描述与 URL scheme。
        # 直接引用仓库里的 Info.plist，版本号由构建设置（CI 传参）展开。
        INFOPLIST_FILE: HomeCamCamera/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
