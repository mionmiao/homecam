name: HomeCamCamera
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  HomeCamCamera:
    type: application
    platform: iOS
    sources: [HomeCamCamera]
    resources:
      - path: HomeCamCamera/Assets.xcassets
    # 必须用 info.properties 显式声明：XcodeGen 会为 app target 生成
    # HomeCamCamera/Info.plist 并覆盖同名文件，只保留它自己认识的键。
    # ${BUILD_NUMBER} 由 CI 通过环境变量注入（XcodeGen spec 环境变量插值）。
    info:
      path: HomeCamCamera/Info.plist
      properties:
        CFBundleDisplayName: 电话
        CFBundleShortVersionString: "1.0.${BUILD_NUMBER}"
        CFBundleVersion: "${BUILD_NUMBER}"
        CFBundleURLTypes:
          - CFBundleURLName: com.homecam.camera
            CFBundleURLSchemes:
              - homecam
        LSApplicationQueriesSchemes:
          - livecontainer
        NSCameraUsageDescription: 仅在网页端开始观看时使用摄像头传输家庭画面。
        NSMicrophoneUsageDescription: 仅在网页端开始观看时传输声音。
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homecam.camera
        PRODUCT_NAME: HomeCam Camera
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
