name: HomeCamCamera
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  HomeCamCamera:
    type: application
    platform: iOS
    sources: [HomeCamCamera]
    info:
      path: HomeCamCamera/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homecam.camera
        PRODUCT_NAME: HomeCam Camera
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
