name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/HomeCamCamera-debug.apk"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: HomeCam Camera (Android Debug APK)
          body: |
            Debug APK，下载后直接安装（需允许安装未知来源应用）。

            配对：服务器填 HTTPS 地址，配对码在网页端生成。
            解锁手机后会自动用前后置摄像头各拍 5 张并上传；观看时不会拍照。

            构建号：${{ github.run_number }}
            更新说明：${{ github.event.head_commit.message }}
          files: ${{ runner.temp }}/HomeCamCamera-debug.apk
