<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeCam</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><h1>HomeCam</h1><span id="connection">未登录</span></header>
<section id="login" class="card"><h2>观看端登录</h2><div class="password-row"><input id="password" type="password" placeholder="管理员密码"><button id="togglePassword" class="ghost" type="button" aria-label="显示密码">显示</button></div><button id="loginButton">登录</button><p id="loginError" class="error"></p></section>
<section id="dashboard" hidden><div class="toolbar"><button id="pairButton">添加摄像头</button><button id="refreshButton">刷新设备</button><button id="logoutButton" class="ghost">登出</button></div><p id="pairing" class="notice" hidden></p><div id="devices" class="devices"></div>
<section class="card player"><div class="video-wrap"><video id="video" autoplay playsinline muted></video><p id="placeholder">选择设备后开始观看</p></div><div class="controls"><button id="watchButton" disabled>开始观看</button><button id="switchCameraButton" disabled>切换摄像头</button><button id="muteButton" disabled>打开声音</button><button id="recordButton" disabled>开始本地录像</button><button id="stopButton" disabled>停止</button></div><p id="watchStatus">待命</p><details id="diagBox"><summary>连接诊断 <button id="copyDiagButton" class="ghost" type="button">复制全部</button></summary><div id="diag" class="diag"></div></details></section></section>
</main><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
