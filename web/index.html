<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeCam</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><h1>HomeCam</h1><span id="connection">未登录</span></header>
<section id="login" class="card"><h2>观看端登录</h2><div class="password-row"><input id="password" type="password" placeholder="管理员密码"><button id="togglePassword" class="ghost" type="button" aria-label="显示密码">显示</button></div><button id="loginButton">登录</button><p id="loginError" class="error"></p></section>
<section id="dashboard" hidden><div id="updateBanner" class="update-banner" hidden><span>观看端有新版本</span><button id="reloadButton" type="button">立即刷新</button><button id="dismissUpdate" class="ghost" type="button">稍后</button></div><div class="toolbar"><button id="pairButton">添加摄像头</button><button id="refreshButton">刷新设备</button><button id="logoutButton" class="ghost">登出</button></div><p id="pairing" class="notice" hidden></p><div id="devices" class="devices"></div>
<section class="card player"><div class="video-wrap" id="videoWrap"><video id="video" autoplay playsinline muted></video><p id="placeholder">选择设备后开始观看</p><div id="recBadge" class="rec-badge" hidden><span class="rec-dot"></span><span id="recTime">00:00</span></div></div><div class="controls"><button id="watchButton" disabled>开始观看</button><button id="switchCameraButton" disabled>切换摄像头</button><button id="muteButton" disabled>打开声音</button><button id="recordButton" disabled>开始本地录像</button><button id="fullscreenButton" class="ghost" disabled type="button">⛶ 全屏</button><button id="stopButton" disabled>停止</button></div>
<div class="controls view-controls"><button id="rotateButton" class="ghost" type="button" title="旋转90°">↻ 旋转</button><button id="zoomInButton" class="ghost" type="button" title="放大">＋ 放大</button><button id="zoomOutButton" class="ghost" type="button" title="缩小">－ 缩小</button><button id="mirrorButton" class="ghost" type="button" title="左右镜像">⇋ 镜像</button><button id="resetViewButton" class="ghost" type="button" title="重置画面">重置</button><label class="exposure">曝光 <input id="exposure" type="range" min="-3" max="3" step="0.1" value="0"><span id="exposureInfo" class="view-info">0.0 EV</span></label><span id="viewInfo" class="view-info">100%</span></div><p id="watchStatus">待命</p><details id="diagBox"><summary>连接诊断 <button id="copyDiagButton" class="ghost" type="button">复制全部</button></summary><div id="diag" class="diag"></div></details></section>
<section class="card photos"><div class="photos-head"><h2>最近照片</h2><button id="refreshPhotosButton" class="ghost" type="button">刷新</button></div><h3>后置摄像头</h3><div id="backPhotos" class="photo-grid"><span class="photo-empty">暂无照片</span></div><h3>前置摄像头</h3><div id="frontPhotos" class="photo-grid"><span class="photo-empty">暂无照片</span></div></section></section>
<p class="build-info" id="buildInfo">版本 —</p>
</main><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
